name: GCC compile and sample-run checks for all C programs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile every C source file
        shell: bash
        run: |
          set +e
          mkdir -p audit
          : > audit/compile-errors.txt
          total=0
          passed=0
          failed=0

          while IFS= read -r -d '' source; do
            total=$((total + 1))
            relative="${source#./}"
            binary="/tmp/upes-program-$total"
            if gcc -std=c11 -Wall -Wextra -pedantic "$source" -lm -o "$binary" 2>> audit/compile-errors.txt; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              printf 'COMPILE FAILED: %s\n' "$relative" >> audit/compile-errors.txt
            fi
          done < <(find . -type f -name '*.c' -print0 | sort -z)

          {
            echo "C files found: $total"
            echo "Compiled successfully: $passed"
            echo "Compile failures: $failed"
          } | tee audit/compile-summary.txt

          if [ "$total" -ne 146 ]; then
            echo "Expected exactly 146 C files." | tee -a audit/compile-summary.txt
            exit 1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Run available official sample test cases
        run: |
          python3 .github/scripts/run_samples.py

      - name: Run generated runtime smoke tests for every C program
        run: |
          python3 .github/scripts/runtime_smoke.py

      - name: Run semantic tests for descriptive sample inputs
        run: |
          python3 .github/scripts/semantic_samples.py

      - name: Upload compiler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-compile-report
          path: |
            audit/
            sample-test-report.txt
