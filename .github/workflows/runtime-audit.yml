name: Individual Runtime Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run all programs individually
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tempfile, urllib.request
          from pathlib import Path

          ROOT = Path.cwd()
          QUESTION_URL = "https://raw.githubusercontent.com/maitysoumik/basic-coding-with-c/main/questions2.json"
          with urllib.request.urlopen(QUESTION_URL, timeout=30) as response:
              bank = json.load(response)
          questions = {q["id"]: q for section in bank["questionBank"] for q in section["questions"]}

          def location(qid):
              if qid <= 100:
                  return (qid + 1) // 2, (1 if qid % 2 else 2)
              return qid - 50, 1

          def tokens(value):
              return re.findall(r"[-+]?(?:\d+\.\d+|\d+)|[A-Za-z]+|₹", value.casefold())

          def same_token(a, b):
              try:
                  return abs(float(a) - float(b)) < 0.011
              except ValueError:
                  return a == b

          def contains_expected(actual, expected):
              wanted = tokens(expected)
              got = tokens(actual)
              if not wanted:
                  return " ".join(expected.split()) == " ".join(actual.split())
              pos = 0
              for token in got:
                  if pos < len(wanted) and same_token(token, wanted[pos]):
                      pos += 1
              return pos == len(wanted)

          overrides = {
              4: {0: "Area=153.94, Circumference=43.98"},
              9: {1: "Simple Interest=1050, Compound Interest=1125.22"},
              44: {0: "Approximate sum: 2.6", 1: "Approximate sum: 4.4"},
              45: {0: "Approximate sum: 1.78", 1: "Approximate sum: 2.84"},
              123: {0: "Characters: 33\nWords: 6\nLines: 2"},
          }

          custom = {
              101: ("6\n5 7 7 8 8 10\n8\n", "3,4", {}),
              102: ("7\n1 2 8 10 11 12 19\n5\n", "2", {}),
              103: ("6\n1 7 3 6 5 6\n", "3", {}),
              104: ("8\n", "6", {}),
              105: ("3\n3 2 3\n", "3", {}),
              106: ("4\n1 3 2 4\n", "3, 4, 4, -1", {}),
              107: ("4\n1 3 2 4\n", "-1, -1, 3, -1", {}),
              108: ("4\n1 2 3 4\n", "[24,12,8,6]", {}),
              109: ("4\n100 200 300 400\n2\n", "700", {}),
              110: ("9\n1 2 3 1 4 5 2 3 6\n3\n", "3 3 4 5 5 5 6", {}),
              111: ("5\n-8 2 3 -6 10\n2\n", "-8 0 -6 -6", {}),
              112: ("7\n2 3 -8 7 -1 2 3\n", "11", {}),
              113: ("6\n7 10 4 3 20 15\n3\n", "7", {}),
              114: ("abcabcbb\n", "3", {}),
              115: ("anagram\nnagaram\n", "Anagram", {}),
              116: ("4\n2 7 11 15\n9\n", "0 1", {}),
              117: ("4\n2 7 11 15\n3\n4 8 10\n", "2 4 7 8 10 11 15", {}),
              118: ("4\n0 3 2 4\n", "1", {}),
              119: ("4\n1 3 3 4\n", "3", {}),
              120: ("I am trying to build logic.\n", "I Am Trying To Build Logic.", {}),
              121: ("Rahul 23\n", "File created successfully! Data written to info.txt", {}),
              122: ("", "Name: Rahul\nAge: 23", {"info.txt": "Name: Rahul\nAge: 23\n"}),
              123: ("", "Characters: 33\nWords: 6\nLines: 2", {"sample.txt": "Hello world\nThis is C programming"}),
              124: ("source.txt destination.txt\n", "File copied successfully", {"source.txt": "Learning C File Handling"}),
              125: ("This is appended text.\n", "File updated successfully", {"data.txt": "Hello world"}),
              126: ("sample.txt\n", "File opened successfully", {"sample.txt": "Sample file is present.\n"}),
              127: ("", "Conversion completed", {"input.txt": "Hello World\nC programming"}),
              128: ("", "Vowels: 8\nConsonants: 10", {"text.txt": "Welcome to C language"}),
              129: ("", "Sum = 150\nAverage = 30.00", {"numbers.txt": "10 20 30 40 50"}),
              130: ("2\nAsha 101 85\nRavi 102 92\n", "Asha 101 85\nRavi 102 92", {}),
              131: ("", "SUNDAY = 0", {}),
              132: ("GREEN\n", "Go", {}),
              133: ("FEB\n", "28 or 29 days", {}),
              134: ("FAILURE\n", "Operation failed", {}),
              135: ("", "A=10", {}),
              136: ("ADD 10 20\n", "30", {}),
              137: ("GUEST\n", "Welcome Guest!", {}),
              138: ("", "RED=0", {}),
              139: ("", "SUCCESS=0", {}),
              140: ("MALE\n", "Male", {}),
              141: ("Asha 101 90\n", "Name: Asha | Roll: 101 | Marks: 90", {}),
              142: ("Asha 101 85\nRavi 102 92\nNeha 103 81\nAman 104 77\nRiya 105 95\n", "Asha", {}),
              143: ("3\nRavi 101 95\nSita 102 85\nAman 103 88\n", "Topper: Ravi (Marks: 95)", {}),
              144: ("Neha 104 92\n", "Name: Neha | Roll: 104 | Marks: 92", {}),
              145: ("3\nRiya 101 89\nKaran 102 96\nMeena 103 92\n", "Top Student: Karan | Roll: 102 | Marks: 96", {}),
              146: ("Employee: Raj | ID: 11 | Joining Date: 12 05 2020\n", "Name: Raj | ID: 11 | Joining Date: 12/05/2020", {}),
              147: ("Employee: John 1001 55000\n", "John | ID: 1001 | Salary: 55000", {}),
              148: ("Student1: Asha 101 90\nStudent2: Asha 101 90\n", "Same", {}),
              149: ("Student allocated dynamically with details: Tina 105 88\n", "Name: Tina | Roll: 105 | Marks: 88", {}),
              150: ("Student pointer modifying values: John 106 91\n", "Modified Data: Name: John | Roll: 106 | Marks: 91", {}),
          }

          # Construct each program's runtime cases. Questions 1-100 use all
          # runnable source-bank samples; later questions use format-adapted inputs.
          cases = {}
          for qid in range(1, 101):
              q = questions[qid]
              tests = []
              for index, tc in enumerate(q.get("testCases", [])):
                  inp = tc.get("input", "")
                  exp = tc.get("output", "")
                  # The upstream set includes explanatory note-only rows, not executable cases.
                  if exp.strip().lower().startswith("note:"):
                      continue
                  if qid in (52, 54) and exp.lower().startswith("pattern with"):
                      exp = None
                  if qid in overrides and index in overrides[qid]:
                      exp = overrides[qid][index]
                  tests.append((inp, exp, {}))
              cases[qid] = tests[:4]
          for qid, (inp, exp, fixtures) in custom.items():
              cases[qid] = [(inp, exp, fixtures)]

          report = []
          total_runs = 0
          runtime_failures = []
          output_mismatches = []
          file_mismatches = []
          timeout_failures = []
          compile_failures = []

          with tempfile.TemporaryDirectory(prefix="runtime-audit-") as build_root:
              build_root = Path(build_root)
              for qid in range(1, 151):
                  day, program = location(qid)
                  source = ROOT / f"Day {day}" / f"problem-{program}.c"
                  label = f"Q{qid:03d} Day {day} Program {program}"
                  if not source.is_file():
                      row = f"{label}: MISSING SOURCE"
                      report.append(row)
                      runtime_failures.append(row)
                      continue

                  executable = build_root / f"q{qid}"
                  # Compilation is only the prerequisite for execution; this audit reports runtime behaviour.
                  built = subprocess.run(
                      ["gcc", "-std=c11", str(source), "-lm", "-o", str(executable)],
                      capture_output=True, text=True, timeout=20
                  )
                  if built.returncode != 0:
                      row = f"{label}: COULD NOT RUN (build prerequisite failed)"
                      report.append(row)
                      compile_failures.append((row, built.stderr))
                      continue

                  outcomes = []
                  for case_index, (stdin_text, expected, fixtures) in enumerate(cases.get(qid, []), 1):
                      total_runs += 1
                      with tempfile.TemporaryDirectory(prefix=f"q{qid}-case-") as work:
                          work = Path(work)
                          for filename, body in fixtures.items():
                              (work / filename).write_text(body, encoding="utf-8")
                          try:
                              result = subprocess.run(
                                  [str(executable)], input=stdin_text, text=True,
                                  capture_output=True, cwd=work, timeout=3
                              )
                          except subprocess.TimeoutExpired:
                              timeout_failures.append((label, case_index, stdin_text))
                              outcomes.append("TIMEOUT")
                              continue

                          if result.returncode != 0:
                              runtime_failures.append((label, case_index, result.returncode,
                                                       result.stdout[-400:], result.stderr[-400:]))
                              outcomes.append(f"EXIT_{result.returncode}")
                              continue

                          if expected and not contains_expected(result.stdout, expected):
                              output_mismatches.append((label, case_index, expected,
                                                         result.stdout[-500:]))
                              outcomes.append("OUTPUT_MISMATCH")
                          else:
                              outcomes.append("PASS")

                          # Verify files written/modified by file-handling exercises.
                          if qid == 121:
                              ok = (work / "info.txt").exists() and "Rahul" in (work / "info.txt").read_text()
                          elif qid == 124:
                              ok = (work / "destination.txt").exists() and (work / "destination.txt").read_bytes() == (work / "source.txt").read_bytes()
                          elif qid == 125:
                              content = (work / "data.txt").read_text() if (work / "data.txt").exists() else ""
                              ok = "Hello world" in content and "This is appended text." in content
                          elif qid == 127:
                              ok = (work / "output.txt").exists() and (work / "output.txt").read_text() == "HELLO WORLD\nC PROGRAMMING"
                          elif qid == 130:
                              ok = (work / "students.txt").exists() and "Asha 101 85.00" in (work / "students.txt").read_text()
                          elif qid == 147:
                              ok = (work / "employee.dat").exists() and (work / "employee.dat").stat().st_size > 0
                          else:
                              ok = True
                          if not ok:
                              file_mismatches.append((label, case_index, result.stdout[-400:]))

                  outcome = ",".join(outcomes) if outcomes else "NO_CASE"
                  report.append(f"{label}: {outcome}")

          print("\n".join(report))
          print("\nRUNTIME_AUDIT_TOTAL_RUNS=" + str(total_runs))
          print("RUNTIME_AUDIT_PROGRAMS=150")
          print("RUNTIME_FAILURES=" + str(len(runtime_failures)))
          print("TIMEOUTS=" + str(len(timeout_failures)))
          print("OUTPUT_MISMATCHES=" + str(len(output_mismatches)))
          print("FILE_MISMATCHES=" + str(len(file_mismatches)))
          print("BUILD_PREREQUISITE_FAILURES=" + str(len(compile_failures)))

          detailed = []
          if runtime_failures:
              detailed.append("\nRUNTIME FAILURES:")
              detailed.extend(map(str, runtime_failures))
          if timeout_failures:
              detailed.append("\nTIMEOUTS:")
              detailed.extend(map(str, timeout_failures))
          if output_mismatches:
              detailed.append("\nOUTPUT MISMATCHES:")
              detailed.extend(map(str, output_mismatches))
          if file_mismatches:
              detailed.append("\nFILE MISMATCHES:")
              detailed.extend(map(str, file_mismatches))
          if compile_failures:
              detailed.append("\nBUILD PREREQUISITE FAILURES:")
              detailed.extend(str(x) + "\n" + y for x, y in compile_failures)

          Path(os.environ["RUNNER_TEMP"], "runtime-audit-report.txt").write_text(
              "\n".join(report) + "\n" + "\n".join(detailed) + "\n",
              encoding="utf-8"
          )

          summary = [
              "## Individual runtime audit",
              "",
              f"- Programs attempted: 150",
              f"- Executed test cases: {total_runs}",
              f"- Runtime failures: {len(runtime_failures)}",
              f"- Timeouts: {len(timeout_failures)}",
              f"- Output mismatches requiring review: {len(output_mismatches)}",
              f"- File side-effect mismatches: {len(file_mismatches)}",
              f"- Build prerequisite failures: {len(compile_failures)}",
              "",
              "Full per-program details are in the `runtime-audit-results` artifact."
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary), encoding="utf-8")
          PY

      - name: Upload runtime audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-results
          path: ${{ runner.temp }}/runtime-audit-report.txt
          if-no-files-found: error
